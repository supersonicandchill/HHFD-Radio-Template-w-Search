
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>HHFD – County FD Radio Template</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Share+Tech+Mono&family=Barlow+Condensed:wght@400;500;600;700&display=swap');

  :root {
    --bg:#0b0f18; --surface:#131926; --surface2:#192030; --border:#2a3347;
    --accent:#1e6fbf; --accent2:#f0a500; --text:#e6edf3; --muted:#7d8fa8; --red:#da3633;
    --match-bg:rgba(240,165,0,.2); --match-border:#f0a500;
    --fs-value:16px; --fs-ch:14px; --fs-title:20px; --fs-sub:12px; --fs-header:22px;
  }

  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }

  body {
    background:var(--bg); color:var(--text);
    font-family:'Barlow Condensed',sans-serif;
    min-height:100vh; overscroll-behavior-y:none;
  }

  header {
    background:linear-gradient(160deg,#0b0f18 0%,#131e30 55%,#0b0f18 100%);
    border-bottom:3px solid var(--accent);
    padding:12px 16px 10px;
    display:flex; flex-direction:column; gap:10px;
    position:sticky; top:0; z-index:200;
    box-shadow:0 3px 18px rgba(0,0,0,.75);
  }

  .header-top { display:flex; align-items:center; gap:12px; }

  .badge {
    background:var(--accent); color:#fff;
    font-family:'Rajdhani',sans-serif; font-weight:700;
    font-size:11px; letter-spacing:2px;
    padding:4px 10px; border-radius:4px;
    text-transform:uppercase; white-space:nowrap; flex-shrink:0;
  }

  h1 { font-family:'Rajdhani',sans-serif; font-weight:700; font-size:var(--fs-header); letter-spacing:1px; line-height:1.1; }
  h1 span { color:var(--accent2); }
  .subtitle { font-family:'Share Tech Mono',monospace; font-size:10px; color:var(--muted); letter-spacing:.8px; margin-top:3px; }

  .search-row { display:flex; gap:8px; align-items:center; }
  #searchInput {
    flex:1; min-width:0;
    background:var(--surface2); border:1.5px solid var(--border);
    color:var(--text); font-family:'Share Tech Mono',monospace;
    font-size:16px; padding:10px 14px; border-radius:6px; outline:none;
    transition:border-color .2s;
  }
  #searchInput:focus { border-color:var(--accent); }
  #searchInput::placeholder { color:var(--muted); font-size:14px; }

  .nav-btn {
    background:var(--surface2); border:1.5px solid var(--border); color:var(--text);
    font-size:18px; padding:8px 14px; border-radius:6px; cursor:pointer;
    transition:background .15s; flex-shrink:0; line-height:1;
    min-width:44px; min-height:44px; display:flex; align-items:center; justify-content:center;
  }
  .nav-btn:hover,.nav-btn:active { background:var(--accent); border-color:var(--accent); }
  .nav-btn:disabled { opacity:.3; }
  .nav-btn:disabled:hover { background:var(--surface2); border-color:var(--border); }

  .clear-btn {
    background:transparent; border:1.5px solid var(--border); color:var(--muted);
    font-size:15px; padding:8px 11px; border-radius:6px; cursor:pointer;
    min-width:44px; min-height:44px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .clear-btn:hover,.clear-btn:active { border-color:var(--red); color:var(--red); }

  #matchCount { font-family:'Share Tech Mono',monospace; font-size:12px; color:var(--accent2); white-space:nowrap; min-width:60px; text-align:right; flex-shrink:0; }

  .tools-row { display:flex; gap:8px; align-items:center; }
  .tool-btn {
    background:transparent; border:1.5px solid var(--border); color:var(--muted);
    font-family:'Barlow Condensed',sans-serif; font-size:14px; font-weight:600;
    padding:6px 12px; border-radius:5px; cursor:pointer; min-height:36px; letter-spacing:.5px;
  }
  .tool-btn:hover,.tool-btn:active { border-color:var(--accent); color:var(--accent); }

  main { padding:12px; max-width:900px; margin:0 auto; }

  .accordion { border:1.5px solid var(--border); border-radius:8px; margin-bottom:10px; overflow:hidden; }
  .accordion.has-match { border-color:var(--match-border); box-shadow:0 0 0 1px var(--match-border),0 4px 16px rgba(240,165,0,.12); }

  .acc-header {
    display:flex; align-items:center; padding:13px 14px;
    cursor:pointer; background:var(--surface); gap:12px;
    user-select:none; -webkit-user-select:none;
    transition:background .15s; min-height:62px;
  }
  .acc-header:active { background:var(--surface2); }

  .zone-stripe { width:6px; min-height:44px; border-radius:3px; flex-shrink:0; }

  /* Zone number badge — prominent for fast visual scan */
  .zone-num {
    font-family:'Rajdhani',sans-serif; font-weight:700;
    font-size:22px; color:var(--accent2);
    min-width:36px; text-align:center; flex-shrink:0; line-height:1;
  }

  .acc-title-wrap { flex:1; min-width:0; }
  .acc-title { font-family:'Rajdhani',sans-serif; font-weight:700; font-size:var(--fs-title); letter-spacing:.5px; line-height:1.1; }
  .acc-sub { font-family:'Share Tech Mono',monospace; font-size:var(--fs-sub); color:var(--muted); margin-top:2px; line-height:1.2; }

  .match-pill {
    background:var(--match-bg); border:1px solid var(--match-border);
    color:var(--accent2); font-family:'Share Tech Mono',monospace;
    font-size:11px; padding:2px 8px; border-radius:10px;
    display:none; white-space:nowrap; flex-shrink:0;
  }
  .has-match .match-pill { display:block; }
  .chevron { color:var(--muted); font-size:14px; transition:transform .25s; flex-shrink:0; margin-left:2px; }
  .accordion.open .chevron { transform:rotate(180deg); }

  .acc-body { display:none; background:var(--surface2); border-top:1.5px solid var(--border); }
  .accordion.open .acc-body { display:block; }

  .grid-table { width:100%; border-collapse:collapse; }
  .grid-table thead tr { background:rgba(11,15,24,.85); border-bottom:1.5px solid var(--border); }
  .grid-table th {
    color:var(--accent); font-family:'Rajdhani',sans-serif; font-weight:700;
    font-size:12px; letter-spacing:1.5px; text-transform:uppercase;
    padding:8px 14px; text-align:left; white-space:nowrap;
  }
  .grid-table td {
    padding:11px 14px; border-bottom:1px solid rgba(42,51,71,.4);
    vertical-align:middle; line-height:1.3;
  }
  .grid-table tr:last-child td { border-bottom:none; }
  .grid-table tr:active td { background:rgba(255,255,255,.03); }

  .ch-col {
    font-family:'Rajdhani',sans-serif; font-weight:700;
    font-size:var(--fs-ch); color:var(--accent2);
    width:52px; min-width:52px; white-space:nowrap;
  }
  .val-col { font-family:'Share Tech Mono',monospace; font-size:var(--fs-value); color:var(--text); word-break:break-word; }

  mark { background:rgba(240,165,0,.3); color:#ffd370; border-radius:2px; padding:0 1px; }
  .current-match mark { background:rgba(30,111,191,.55); color:#fff; outline:1.5px solid var(--accent); border-radius:2px; }

  @media(min-width:640px){
    :root { --fs-value:14px; --fs-ch:13px; --fs-title:18px; --fs-sub:11px; --fs-header:24px; }
    main { padding:16px; }
    .acc-header { min-height:56px; padding:12px 16px; }
    .grid-table td { padding:8px 16px; }
    .zone-num { font-size:20px; }
  }
</style>
</head>
<body>
<header>
  <div class="header-top">
    <div class="badge">🔵 HHFD</div>
    <div>
      <h1>HUBER HEIGHTS <span>RADIO</span></h1>
      <div class="subtitle">COUNTY FD TEMPLATE · ZONE-FIRST · CH 1–16 PER ZONE</div>
    </div>
  </div>
  <div class="search-row">
    <input type="text" id="searchInput" placeholder="Search Z1, 57CMH, SIMPLEX…" autocomplete="off" spellcheck="false" autocorrect="off" autocapitalize="none">
    <button class="nav-btn" id="prevBtn" disabled aria-label="Previous">▲</button>
    <button class="nav-btn" id="nextBtn" disabled aria-label="Next">▼</button>
    <button class="clear-btn" id="clearBtn" aria-label="Clear">✕</button>
    <div id="matchCount"></div>
  </div>
  <div class="tools-row">
    <button class="tool-btn" id="expandAll">Expand All</button>
    <button class="tool-btn" id="collapseAll">Collapse All</button>
  </div>
</header>
<main id="main"></main>
<script>
// Zones — num is displayed prominently for fast visual scan
const ZONES=[
  {key:"Z1",  num:"Z1",  label:"Zone 1",   sub:"Z1 · Huber Heights Primary",                       color:"#c0392b"},
  {key:"Z2",  num:"Z2",  label:"Zone 2",   sub:"Z2 · Fairborn / Miami Co.",                         color:"#27ae60"},
  {key:"Z3",  num:"Z3",  label:"Zone 3",   sub:"Z3 HOSP · Hospital Zone",                           color:"#d4ac0d"},
  {key:"Z4",  num:"Z4",  label:"Zone 4",   sub:"57FD40",                                             color:"#c0392b"},
  {key:"Z5",  num:"Z5",  label:"Zone 5",   sub:"R3HOSP1 · Region 3 Hospital 1",                    color:"#e67e22"},
  {key:"Z8",  num:"Z8",  label:"Zone 8",   sub:"57FD80",                                             color:"#27ae60"},
  {key:"Z9",  num:"Z9",  label:"Zone 9",   sub:"57FD90",                                             color:"#27ae60"},
  {key:"Z10", num:"Z10", label:"Zone 10",  sub:"R3HOSP2 · Region 3 Hospital 2",                    color:"#e67e22"},
  {key:"Z27", num:"Z27", label:"Zone 27",  sub:"12 FIRE 1 · 12COFD Clarke Co. / Bethel / New Carlisle", color:"#2d6fa3"},
  {key:"Z28", num:"Z28", label:"Zone 28",  sub:"29 FIRE 1 · 29GFWDISP Greene Co. West",            color:"#27ae60"},
  {key:"Z29", num:"Z29", label:"Zone 29",  sub:"29 FIRE 2 · 29GFEDIS Greene Co. East",             color:"#1e8449"},
  {key:"Z30", num:"Z30", label:"Zone 30",  sub:"55 FIRE · 55FIREMS-S Miami County",                 color:"#c0392b"},
];

const DATA={
  Z1: ["57HHFD DISP","57OPS42","57OPS43","57OPS44","57OPS45","57MED4A","57MED4B","57MED4C","57RDCFIRE1","57OPS83","57OPS84","57OPS8A","57OPS8B","57VFD","57OPS46","SIMPLEX"],
  Z2: ["57HHFD DISP","29FBFDISP Fairborn Disp","23FTAC 1","55FREMS-1 Miami County Disp","55MCF-TAC1","55BEF-TAC1 Bethel Miami TAC 1","57HHFD INSP","57 HHPD DISP","57 HHPD TAC1","57 HH PWORKS","57 HH CITYWD","57 HHFD TRNG","57 HH SCH SEC","57 RANGER","HSR3-USAR","SIMPLEX"],
  Z3: ["57HHFD DISP","57CMH","57GSH","57GSH N","57GVH","57HHER","57KMC","57MVH","57MVHS","57SVH","57VAHOSP","29WPMC","HSR3-MCI","8TAC92D A1","7AG88D LZ","SIMPLEX"],
  Z4: ["57HHFD DISP","57OPS42","57OPS43","57OPS44","57OPS45","57OPS46","57OPS47","57OPS48","57OPS49","57MEDIC4A","57MEDIC4B","57MEDIC4C","57HHFDISP","57VFD","57HHFDIS 2","SIMPLEX"],
  Z5: ["57HHFD DISP","57CMH","57GSH","57GSH N","57GVH","57HHER","57KMC","57MVH","57MVHS","575VH","57SMC","57VAHOSP","57ED1","57ED2","HSR3-MCI","SIMPLEX"],
  Z8: ["57HHFD DISP","57RDCFIRE2 OUTBOUND ONLY","57OPS83","57OPS84","57OPS85","57OPS86","57OPS87","57OPS88","57OPS89","57OPS80","57OPS8A","57OPS8B","57OPS8C","57OPS8D","57RDCFIRE1","SIMPLEX"],
  Z9: ["57HHFD DISP","57RDCFIRE2 OUTBOUND ONLY","57OPS93","57OPS94","57OPS85","57OPS96","57OPS97","57OPS98","57OPS99","57OPS90","57OPS9A","57OPS9B","57OPS9C","57OPS9D","SIMPLEX","SIMPLEX"],
  Z10:["57HHFD DISP","29GMH","29SOIN","29WPMC","83KEC FS","19WAYNE","12SRMC","55UVMC","11MERCY","68PREB","09ATRIUM","HSR3 ED3","HSR3 MCI","8TAC92D A1 (AIR MED PRI)","7AG88D LZ (AIR MED SEC1)","SIMPLEX"],
  Z27:["12FDTAC6","12FDTAC7","12FDTAC8","12FDTAC9","12HOS1201","R","8TAC91D PD","8TAC92D A1","SIMPLEX","8TAC94D A2","12SO DIS","12COTAC1","12COEMA","12MARCS12","SIMPLEX","SIMPLEX"],
  Z28:["29FTAC 1","29FTAC 2","29FTAC 3","29FTAC 4","29FTAC 5","29FTAC 6","29FTAC 7","29FTAC 8","29BVFDIS Beavercreek Disp","29FBFDISP Fairborn Disp","29 CW 1","29 CW 2","29 CW 3","29 CW 4","SIMPLEX","SIMPLEX"],
  Z29:["29FTAC 9","29FTAC10","29FTAC11","29FTAC12","29FTAC13","29FTAC14","29FTAC15","29FTAC16","29BVF DISP Beavercreek Disp","29XCFDIS Xenia Disp","29 CW 1","29 CW 2","29 CW 3","29 CW 4","SIMPLEX","SIMPLEX"],
  Z30:["55FIREMS-2","55MCF-TAC3","55MCF-TAC2","55MCF-TAC3","55MCF-TAC4","55MCE-TAC1","55MCE-TAC2","55MCE-TAC3","55MCE-TAC4","55TCF-TAC1 Tipp City TAC 1","55TCE-TAC1","55WMF-TAC8 West Milton","55BEF-TAC3 Bethel Miami","55-911","SIMPLEX","SIMPLEX"],
};

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function hl(t,q){const e=esc(t);if(!q)return e;return e.replace(new RegExp('('+escRe(q)+')','gi'),'<mark>$1</mark>');}
function hits(t,q){if(!q)return 0;return(t.match(new RegExp(escRe(q),'gi'))||[]).length;}

const mainEl=document.getElementById('main');

function render(query){
  mainEl.innerHTML='';
  const q=(query||'').trim().toLowerCase();
  let total=0;
  ZONES.forEach(zone=>{
    const vals=DATA[zone.key];
    const allText=(vals.join(' ')+' '+zone.num+' '+zone.label+' '+zone.sub).toLowerCase();
    const n=q?hits(allText,q):0;
    total+=n;
    const div=document.createElement('div');
    div.className='accordion'+(q&&n>0?' has-match':'');
    const rows=vals.map((v,i)=>`<tr>
      <td class="ch-col">CH&nbsp;${i+1}</td>
      <td class="val-col">${hl(v,q)}</td>
    </tr>`).join('');
    div.innerHTML=`
      <div class="acc-header" onclick="toggleAcc(this)">
        <span class="zone-stripe" style="background:${zone.color}"></span>
        <span class="zone-num" style="color:${zone.color}">${esc(zone.num)}</span>
        <div class="acc-title-wrap">
          <div class="acc-title">${esc(zone.label)}</div>
          <div class="acc-sub">${esc(zone.sub)}</div>
        </div>
        <span class="match-pill">${n} match${n!==1?'es':''}</span>
        <span class="chevron">▼</span>
      </div>
      <div class="acc-body">
        <table class="grid-table">
          <thead><tr><th>CH</th><th>CALL SIGN / ASSIGNMENT</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
    mainEl.appendChild(div);
  });
  if(q){
    document.querySelectorAll('.accordion.has-match').forEach(a=>a.classList.add('open'));
    document.querySelectorAll('.accordion:not(.has-match)').forEach(a=>a.classList.remove('open'));
  }
  const mc=document.getElementById('matchCount');
  mc.textContent=q?(total===0?'No matches':`${total} match${total!==1?'es':''}`):'';
}

function toggleAcc(h){h.closest('.accordion').classList.toggle('open');}

let marks=[],cur=-1;
const prevBtn=document.getElementById('prevBtn');
const nextBtn=document.getElementById('nextBtn');
function gather(){marks=Array.from(document.querySelectorAll('.accordion.open mark'));cur=marks.length?0:-1;nav();}
function nav(){prevBtn.disabled=!marks.length||cur<=0;nextBtn.disabled=!marks.length||cur>=marks.length-1;}
function focusMark(i){
  document.querySelectorAll('.current-match').forEach(m=>m.classList.remove('current-match'));
  if(i<0||i>=marks.length)return;
  cur=i;const m=marks[i];m.classList.add('current-match');
  const acc=m.closest('.accordion');if(acc&&!acc.classList.contains('open'))acc.classList.add('open');
  m.scrollIntoView({behavior:'smooth',block:'center'});nav();
  document.getElementById('matchCount').textContent=`${i+1} / ${marks.length}`;
}
prevBtn.addEventListener('click',()=>focusMark(cur-1));
nextBtn.addEventListener('click',()=>focusMark(cur+1));
document.getElementById('clearBtn').addEventListener('click',()=>{
  document.getElementById('searchInput').value='';
  render('');marks=[];cur=-1;prevBtn.disabled=true;nextBtn.disabled=true;
  document.getElementById('matchCount').textContent='';
});
let tmr;
document.getElementById('searchInput').addEventListener('input',e=>{
  clearTimeout(tmr);
  tmr=setTimeout(()=>{
    const q=e.target.value.trim();render(q);
    if(q){setTimeout(()=>{gather();if(marks.length)focusMark(0);},30);}
    else{marks=[];cur=-1;prevBtn.disabled=true;nextBtn.disabled=true;}
  },150);
});
document.getElementById('searchInput').addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.shiftKey?focusMark(cur-1):focusMark(cur+1);}
  if(e.key==='Escape')document.getElementById('clearBtn').click();
});
document.getElementById('expandAll').addEventListener('click',()=>document.querySelectorAll('.accordion').forEach(a=>a.classList.add('open')));
document.getElementById('collapseAll').addEventListener('click',()=>{
  document.querySelectorAll('.accordion').forEach(a=>a.classList.remove('open'));marks=[];cur=-1;nav();
});
render('');
</script>
</body>
</html>
